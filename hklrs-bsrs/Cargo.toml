[package]
name = "hklrs-bsrs"
description = "bsrs diffractometer device, pseudo axes and plans over hklrs"
version.workspace = true
edition.workspace = true
# bsrs's own floor
rust-version = "1.98"
license.workspace = true
publish = false

[dependencies]
hklrs = { path = "../hklrs" }
bsrs = { version = "=0.6.2", default-features = false }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
rust-hdf5 = { workspace = true, optional = true }

[features]
# Hdf5FrameReader, frames from areaDetector's HDF5 files
hdf5 = ["hklrs/hdf5", "dep:rust-hdf5"]

[dev-dependencies]
# Lua and the registry, to call the Lua methods as the queue server does
bsrs = { version = "=0.6.2", default-features = false, features = ["host"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
