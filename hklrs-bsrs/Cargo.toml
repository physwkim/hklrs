[package]
name = "hklrs-bsrs"
description = "bsrs diffractometer device, pseudo axes and plans over hklrs"
version.workspace = true
edition.workspace = true
# bsrs's own floor
rust-version = "1.98"
license.workspace = true
publish = false

[dependencies]
hklrs = { path = "../hklrs" }
bsrs = { version = "=0.6.2", default-features = false }
async-trait = "0.1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
# a saved configuration reads back bit for bit
serde_json = { workspace = true, features = ["float_roundtrip"] }
# reads the YAML hklpy2 (PyYAML) writes, anchors included
serde-saphyr = { version = "2.2", default-features = false, features = ["serialize", "deserialize"] }
thiserror = { workspace = true }
rust-hdf5 = { workspace = true, optional = true }

[features]
# Hdf5FrameReader, frames from areaDetector's HDF5 files
hdf5 = ["hklrs/hdf5", "dep:rust-hdf5"]
# tests/rsm_ioc.rs: bsrs's Channel Access devices against areaDetector's C
# simDetector IOC, which tests/ioc/simdetector-ioc.sh builds and runs
ioc = ["hdf5", "bsrs/ca"]

[dev-dependencies]
# Lua and the registry, to call the Lua methods as the queue server does
bsrs = { version = "=0.6.2", default-features = false, features = ["host"] }
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
