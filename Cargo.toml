[workspace]
resolver = "3"
members = ["hklrs", "hklrs-py", "hklrs-bsrs"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nalgebra = "0.34"
rayon = "1"
thiserror = "2"
serde_json = "1"
# 0.7.14 reads N-bit integers and raises a checksum mismatch as
# FormatError; bsrs's ^0.7.13 takes it. It needs Rust 1.89. The pure-Rust
# decoders for the filters areaDetector's NDFileHDF5 writes: zlib, LZ4,
# bitshuffle/LZ4 and blosc with all six of its compressors; szip and
# N-bit are always built.
rust-hdf5 = { version = "0.7.14", default-features = false, features = ["deflate", "lz4", "blosc", "zstd"] }

# cargo nextest run -p hklrs (inverse golden): 42 s at opt-level 0,
# 1.8 s at 1.
[profile.test]
opt-level = 1
