[workspace]
resolver = "3"
members = ["hklrs", "hklrs-py"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
nalgebra = "0.34"
rayon = "1"
thiserror = "2"
serde_json = "1"
# the version bsrs pins; it needs Rust 1.89
rust-hdf5 = { version = "0.7.13", default-features = false }

# cargo nextest run -p hklrs (inverse golden): 42 s at opt-level 0,
# 1.8 s at 1.
[profile.test]
opt-level = 1
